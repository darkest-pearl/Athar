name: Android prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build, lint and rules
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --console=plain
      - name: Content gate tests
        run: python scripts/test_content.py
      - uses: actions/upload-artifact@v4
        with:
          name: athar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
