name: Android prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build, lint and rules
        run: bash gradlew assembleDebug lintDebug testDebugUnitTest --console=plain
      - name: Content gate tests
        run: |
          python scripts/test_content.py
          python scripts/test_editorial.py
      - uses: actions/upload-artifact@v4
        with:
          name: athar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash gradlew connectedDebugAndroidTest --console=plain
            bash gradlew installDebug --console=plain
            git worktree add --detach "$RUNNER_TEMP/athar-baseline" 701aa18858601364af3a21bfa0e8b9feff6e88fc
            (cd "$RUNNER_TEMP/athar-baseline" && bash gradlew assembleDebug --console=plain)
            ATHAR_BASELINE_APK="$RUNNER_TEMP/athar-baseline/app/build/outputs/apk/debug/app-debug.apk" ATHAR_ISOLATED_QA=1 python scripts/verify_concept_upgrade.py
            ATHAR_ISOLATED_QA=1 python scripts/verify_concept_lesson.py
            sha256sum app/build/outputs/apk/debug/app-debug.apk > .local/qa/tested-apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athar-device-evidence
          include-hidden-files: true
          path: |
            .local/qa/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
